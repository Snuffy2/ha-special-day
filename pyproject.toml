[project]
name = "special-day"
version = "0.1.0"
description = "Home Assistant special day integration"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
    "homeassistant==2026.10.3",
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.12",
    "mypy>=1.15",
    "prek>=0.2",
    "pytest-homeassistant-custom-component>=0.13.374",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = true
files = ["custom_components/special_day"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC240"]
