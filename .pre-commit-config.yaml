repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: ./.venv/bin/ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: ./.venv/bin/ruff format --check
        language: system
        types: [python]
